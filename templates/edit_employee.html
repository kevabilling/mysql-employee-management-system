<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="form-container">
        <h2>Edit Employee</h2>
        <form method="POST" action="{{ url_for('update_employee', employee_id=employee.id) }}">
            <label>Name</label>
            <input type="text" name="name" value="{{ employee.name }}" required>

            <label>Email</label>
            <input type="email" name="email" value="{{ employee.email }}" required>

            <label>Department</label>
            <input type="text" name="department" value="{{ employee.department }}" required>

            <label>Position</label>
            <input type="text" name="position" value="{{ employee.position }}" required>

            <label>Salary</label>
            <input type="number" step="0.01" name="salary" value="{{ employee.salary }}" required>

            <label>Joining Date</label>
            <input type="date" name="joining_date" value="{{ employee.joining_date }}" required>

            <div class="form-actions">
                <button class="btn primary" type="submit">Update Employee</button>
                <a class="btn secondary" href="{{ url_for('index') }}">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
